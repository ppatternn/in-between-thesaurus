<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08070d">
    <title>In Between Thesaurus</title>
    <script>
        if (window.location.protocol === 'file:') {
            window.location.replace(
                `http://127.0.0.1:8765/thesaurus.html${window.location.search}${window.location.hash}`
            );
        }
    </script>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="thesaurus-page">
    <main class="experience" id="experience" data-state="idle">
        <header class="app-header">
            <a class="brand" href="thesaurus.html" aria-label="Reset In Between Thesaurus">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>In Between Thesaurus</span>
            </a>
            <a class="home-link" href="index.html">Home</a>
        </header>

        <section class="constellation" id="constellation" aria-label="Word connection visualization">
            <svg class="strand-canvas" id="strand-canvas" aria-hidden="true"></svg>
            <div class="word-layer" id="word-layer" aria-hidden="true"></div>

            <div class="intro" id="intro">
                <p class="eyebrow">Find the words in between</p>
                <h1>How does one word<br>become another?</h1>
                <p class="intro-copy">Type two words. We&rsquo;ll trace a path through the language between them.</p>
            </div>

            <div class="path-meta" id="path-meta" aria-live="polite"></div>
            <ol class="sr-only" id="path-transcript" aria-label="Connected word path"></ol>
        </section>

        <section class="composer-region" aria-label="Create a connection">
            <form class="composer" id="composer" novalidate>
                <span class="composer-icon" aria-hidden="true"></span>
                <div class="token-list" id="token-list"></div>
                <label class="sr-only" for="word-input">Enter two words</label>
                <input
                    id="word-input"
                    class="word-input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    placeholder="Type a word, then press space"
                    aria-describedby="composer-help composer-error"
                >
                <button class="connect-button" id="connect-button" type="submit" aria-label="Connect words" disabled>
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>
            <p class="composer-help" id="composer-help">Space or Enter sets each word</p>
            <p class="composer-error" id="composer-error" role="alert"></p>
            <div class="examples" id="examples" aria-label="Example connections">
                <span>Try</span>
                <button type="button" data-pair="memory ocean">memory &rarr; ocean</button>
                <button type="button" data-pair="calm quiet">calm &rarr; quiet</button>
                <button type="button" data-pair="fire ice">fire &rarr; ice</button>
            </div>
        </section>
    </main>

    <script src="script.js?v=4"></script>
</body>
</html>
